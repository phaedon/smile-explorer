name: Bazel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_coverage_linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true

      - name: Configure C++ environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xorg-dev libgl1-mesa-dev lcov

      - name: Build, Test, and Generate Coverage
        run: |
          bazel coverage --combined_report=lcov //...

      - name: Test with AddressSanitizer
        run: |
          bazel test --config=asan //...

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: "$(bazel info output_path)/_coverage/_coverage_report.dat"

  build_macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true

      - name: Build with Bazel
        run: |
          bazel build //... --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1

      - name: Run Tests with Bazel
        run: |
          bazel test //... --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1
  build_windows:
    runs-on: windows-latest

    env:
      # The runner image has LLVM installed here; Bazel's auto-configured
      # clang-cl toolchain (see .bazelrc) finds it through this variable.
      BAZEL_LLVM: C:\Program Files\LLVM

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true

      # A short output root keeps Bazel's paths under Windows' length limit.
      - name: Build with Bazel
        shell: bash
        run: |
          bazel --output_user_root=C:/b build //...

      - name: Run Tests with Bazel
        shell: bash
        run: |
          bazel --output_user_root=C:/b test //...

  build_wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build WebAssembly engine
        run: |
          bazel build //wasm:engine

      - name: Run WebAssembly smoke test
        run: |
          node wasm/smoke_test.mjs

      - name: Type-check and build the web app
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
